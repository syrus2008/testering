name: release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: STABLE | BETA | DEVELOPER
        default: BETA

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install (locked dev deps)
        run: python -m pip install -e ".[dev,ui]" pyinstaller
      - name: Mandatory tests (golden, migration, acceptance)
        run: python -m pytest -q
      - name: Build app (embedded runtime)
        run: pyinstaller packaging/acet.spec --noconfirm --distpath dist
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          $env:ACET_VERSION = (python -c "import acet; print(acet.__version__)")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\acet.iss
      - name: Sign (only when the signing certificate is configured)
        if: ${{ env.SIGNING_CERT_THUMBPRINT != '' }}
        env:
          SIGNING_CERT_THUMBPRINT: ${{ secrets.SIGNING_CERT_THUMBPRINT }}
        run: ./packaging/sign.ps1 -Files dist\ACET\acet.exe,dist\ACET\acet-ui.exe,(Get-ChildItem packaging\Output\*.exe).FullName -CertThumbprint $env:SIGNING_CERT_THUMBPRINT
      - name: SBOM + release evidence
        run: |
          python tools/sbom.py sbom.cdx.json
          python tools/release_evidence.py build release-evidence --sbom sbom.cdx.json --artifacts (Get-ChildItem packaging\Output\*.exe).FullName
      - name: Release gate (STABLE requires complete evidence)
        if: ${{ inputs.channel == 'STABLE' }}
        run: python tools/release_evidence.py check release-evidence --channel STABLE
      - uses: actions/upload-artifact@v4
        with:
          name: acet-${{ inputs.channel }}
          path: |
            packaging/Output/*.exe
            release-evidence/
