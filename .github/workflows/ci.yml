name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests tools
          ruff format --check src tests tools
      - name: Typecheck (strict)
        run: mypy
      - name: Tests (golden replay; live engines run where an Engine Pack is installed)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Traceability matrices up to date (ACET-TRACE-001/002)
        run: python tools/gen_traceability.py --check

  packaging:
    # The artifacts users run, not the sources: frozen build on both OSes; on Windows also the
    # Inno Setup installer (silent per-user install, installed analysis, uninstall keeps data).
    name: packaging smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[ui]" pyinstaller
      - name: Build frozen app
        run: pyinstaller packaging/acet.spec --noconfirm --distpath dist --workpath build
      - name: Third-party license texts (fails if one is missing)
        run: python tools/collect_licenses.py dist/ACET/licenses
      - name: Frozen build smoke test
        run: python tools/frozen_smoke.py dist/ACET
      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:ACET_VERSION = (python -c "import acet; print(acet.__version__)")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\acet.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Installer smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/smoke.ps1 -Dist dist\ACET -Installer (Get-ChildItem packaging\Output\*.exe).FullName -Demo datasets\demo
