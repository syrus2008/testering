name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests tools
          ruff format --check src tests tools
      - name: Typecheck (strict)
        run: mypy
      - name: Tests (golden replay; live engines run where an Engine Pack is installed)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Traceability matrices up to date (ACET-TRACE-001/002)
        run: python tools/gen_traceability.py --check
