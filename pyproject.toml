[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acet"
version = "0.1.0"
description = "ACET — Anti-Cheat Evolution Tracker: local, reproducible longitudinal binary evolution analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
# The Core is intentionally stdlib-only (offline-first, embedded runtime).
dependencies = []

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
# Lint/type tools pinned exactly: CI and local runs must judge the same code the same way.
dev = ["pytest>=8", "hypothesis>=6.100", "ruff==0.16.10", "mypy==2.4.0", "pytest-qt>=4.4", "PySide6>=6.6"]

[project.scripts]
acet = "acet.cli.main:main"

[project.gui-scripts]
acet-ui = "acet.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"acet.storage.migrations" = ["*.sql"]
"acet" = ["schemas/v1/*.json"]
"acet.engines" = ["*.json", "ghidra_scripts/*"]
"acet.platform" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
markers = [
  "acceptance(ids): links a test to one or more ACC-xxx acceptance criteria",
  "real_distribution: may reach the real Engine Pack distribution of this build (tests/live only)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/acet"]
exclude = ["src/acet/engines/qbindiff_runner\\.py"]  # runs in the Engine Pack's own interpreter

[[tool.mypy.overrides]]
module = ["tlsh", "qbindiff.*", "PySide6", "PySide6.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PySide6 ships no py.typed marker: Qt classes are Any for mypy. Strictness is kept
# everywhere else; only subclassing Any / untyped decorators are allowed in the UI layer.
module = ["acet.ui", "acet.ui.*"]
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_return_any = false
